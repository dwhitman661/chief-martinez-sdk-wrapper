name: Build ChiefMartinezSDK bundle

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build bundle
        run: npm run build

      - name: Commit built bundle
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-build chiefMartinezSdkWrapper.bundle.js"
          file_pattern: chiefMartinezSdkWrapper.bundle.js
